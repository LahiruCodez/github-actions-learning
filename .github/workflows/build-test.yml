name: Build and Test

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'sample-app/package-lock.json'

      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install

      - name: Run linter
        working-directory: ./sample-app
        run: npm run lint

      - name: Build app
        working-directory: ./sample-app
        run: npm run build

      - name: Test app
        working-directory: ./sample-app
        run: npm run test

  test-result:
    name: Test result
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()

    steps:
      - name: Show test results
        run: echo "✅ All tests completed"
